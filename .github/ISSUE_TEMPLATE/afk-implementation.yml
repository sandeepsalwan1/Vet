name: AFK implementation
description: Describe an outcome, then let the trusted agent loop implement and validate it.
labels:
  - "agent:implement"
body:
  - type: markdown
    attributes:
      value: |
        Submitting this form records a zero-model intent seal, then starts unattended implementation.
        Routine ambiguity is resolved by the implementer; real safety or authorization decisions still stop for human input.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should be true for the user when this is complete?
      placeholder: A user can...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Plan or context
      description: Link a repository plan/spec, name relevant files, or explain the current behavior.
      placeholder: Follow plan.md, especially...
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable requirements the agent must satisfy.
      placeholder: |
        - [ ] Required behavior works
        - [ ] Regression coverage passes
        - [ ] User-facing docs are current
    validations:
      required: true
  - type: dropdown
    id: proof
    attributes:
      label: Proof
      description: Select the strongest proof the requested behavior needs.
      options:
        - Automated tests and checks
        - UI screenshots through Crabbox
        - GIF or video through Crabbox
        - Trusted deployment, logs, and service health
    validations:
      required: true
  - type: input
    id: proof_route
    attributes:
      label: Proof route
      description: Optional local browser route when UI or GIF proof is required.
      placeholder: /request
  - type: textarea
    id: proof_interaction
    attributes:
      label: Proof interaction
      description: Optional source-blind user steps and visible intermediate or final states.
      placeholder: |
        - Open the route before capture starts
        - Trigger the request
        - Observe the loading state
        - Observe the completed state
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Note scope limits, compatibility contracts, or decisions the agent must preserve.
  - type: textarea
    id: conversation_summary
    attributes:
      label: Conversation intent summary
      description: Optional bounded summary when a trusted issue creator is carrying this request from an agent conversation.
  - type: input
    id: conversation_digest
    attributes:
      label: Conversation source digest
      description: Optional SHA-256 digest of the source conversation used for the summary above.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Start unattended work
      options:
        - label: I understand this issue starts unattended triage and may continue through implementation, review, validation, and safe merge.
          required: true
        - label: I did not include credentials or confidential information.
          required: true
