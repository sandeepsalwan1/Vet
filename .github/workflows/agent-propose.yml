name: Agent Propose

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-propose
  cancel-in-progress: false

jobs:
  allocate-concurrency:
    name: prepare proposer
    runs-on: ubuntu-latest
    outputs:
      backend-effort: ${{ steps.backend.outputs.effort }}
      backend-model: ${{ steps.backend.outputs.model }}
      group: ${{ steps.concurrency.outputs.group }}
      head-sha: ${{ steps.context.outputs.head_sha }}
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select proposer model
        id: backend
        run: node scripts/agent-worker.mjs --validate-backend --lane proposer --json
      - name: Allocate proposer capacity
        id: concurrency
        run: node scripts/agent-concurrency-slot.mjs --lane proposer --key proposer --json
      - name: Capture bounded public main health
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/agent-proposer-context.mjs
          --output .agent-output/proposer-context.json
          --json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-proposer-context
          path: .agent-output/proposer-context.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  generate:
    name: generate proposals
    needs: allocate-concurrency
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.allocate-concurrency.outputs.group }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.allocate-concurrency.outputs.head-sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: agent-proposer-context
          path: .agent-output
      - run: mkdir -p .agent-output
      - name: Install pinned Codex CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund @openai/codex@0.144.1
      - name: Run Codex proposer
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RESULTS_URL: ""
          AGENT_PAT: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: >-
          node scripts/agent-worker.mjs
          --lane proposer
          --model "${{ needs.allocate-concurrency.outputs.backend-model }}"
          --effort "${{ needs.allocate-concurrency.outputs.backend-effort }}"
          --sandbox read-only
          --prompt-file .agent/prompts/propose.md
          --schema .agent/schemas/proposals.schema.json
          --usage-file .agent-output/proposer-usage.json
          --output-file .agent-output/proposals.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-proposals
          path: |
            .agent-output/proposals.json
            .agent-output/proposer-usage.json
          include-hidden-files: true
          if-no-files-found: error

  apply:
    name: apply proposals
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: agent-proposals
          path: .agent-output
      - name: Create proposed issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/agent-propose.mjs --from-file .agent-output/proposals.json --json
