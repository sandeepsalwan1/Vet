name: Agent no-mistakes

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: number
      expected-head-sha:
        required: true
        type: string
      intent:
        required: true
        type: string
      approval:
        description: User approved unattended gate decisions for this exact head
        required: false
        type: boolean
        default: false
      infrastructure-retry:
        required: false
        type: number
        default: 0
      repair-attempt:
        required: false
        type: number
        default: 0
    secrets:
      AGENT_GITHUB_TOKEN:
        description: Repository-scoped owner credential for sealed fix publication
        required: true
      OPENAI_API_KEY:
        description: Model credential for the isolated no-mistakes lane
        required: true
      VERCEL_TOKEN:
        description: Optional Vercel credential for no-mistakes leases
        required: false
      VERCEL_OIDC_TOKEN:
        description: Optional Vercel OIDC credential for no-mistakes leases
        required: false
      HCLOUD_TOKEN:
        description: Optional Hetzner Cloud credential for no-mistakes leases
        required: false
      HETZNER_TOKEN:
        description: Optional legacy Hetzner credential for no-mistakes leases
        required: false
      HETZNER_API_TOKEN:
        description: Optional Hetzner API credential for no-mistakes leases
        required: false
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: number
      expected-head-sha:
        description: Exact current pull request head SHA
        required: true
        type: string
      intent:
        required: true
        type: string
      approval:
        description: User approved unattended gate decisions for this exact head
        required: false
        type: boolean
        default: false
      infrastructure-retry:
        description: Deprecated compatibility input
        required: false
        type: number
        default: 0
      repair-attempt:
        description: Shared semantic revision count
        required: false
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: agent-semantic-${{ inputs.pr-number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare no-mistakes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: write
    outputs:
      default_branch: ${{ steps.prepare.outputs.default_branch }}
      default_sha: ${{ steps.prepare.outputs.default_sha }}
      default_tree: ${{ steps.prepare.outputs.default_tree }}
      merge_base_sha: ${{ steps.prepare.outputs.merge_base_sha }}
      merge_base_tree: ${{ steps.prepare.outputs.merge_base_tree }}
      backend_effort: ${{ steps.backend.outputs.effort }}
      backend_model: ${{ steps.backend.outputs.model }}
      concurrency_group: ${{ steps.concurrency.outputs.group }}
      head_ref: ${{ steps.prepare.outputs.head_ref }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      head_tree: ${{ steps.prepare.outputs.head_tree }}
      replay_passed: ${{ steps.prepare.outputs.replay_passed }}
      skip_model: ${{ steps.prepare.outputs.skip_model }}
    steps:
      - name: Validate approval authority
        if: ${{ inputs.approval }}
        env:
          APPROVAL_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "${APPROVAL_ACTOR,,}" = "${REPOSITORY_OWNER,,}"
      - name: Capture requested PR head
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
        run: |
          set -euo pipefail
          pull_file="$RUNNER_TEMP/no-mistakes-pull.json"
          gh pr view "${{ inputs.pr-number }}" --repo "$GITHUB_REPOSITORY" \
            --json headRepository,isCrossRepository,headRefOid > "$pull_file"
          head_repo="$(jq -r '.headRepository.nameWithOwner // ""' "$pull_file")"
          head_sha="$(jq -r '.headRefOid // ""' "$pull_file")"
          cross_repo="$(jq -r '.isCrossRepository' "$pull_file")"
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" || "$cross_repo" != false || ! "$head_sha" =~ ^[0-9a-f]{40}$ || ! "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ || "$head_sha" != "$REQUESTED_HEAD_SHA" ]]; then
            echo "refusing pending status for an untrusted PR head" >&2
            exit 1
          fi
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select no-mistakes model
        id: backend
        run: node scripts/agent-worker.mjs --validate-backend --lane no-mistakes --json
      - name: Allocate review capacity
        id: concurrency
        env:
          CONCURRENCY_KEY: ${{ inputs.pr-number }}
        run: node scripts/agent-concurrency-slot.mjs --lane review --key "$CONCURRENCY_KEY" --json
      - name: Validate trusted PR and mark pending
        id: prepare
        env:
          GATE_INTENT: ${{ inputs.intent }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/agent-no-mistakes-gate.mjs
          --pr-number "${{ inputs.pr-number }}"
          --expected-head "${{ inputs.expected-head-sha }}"
          --intent "$GATE_INTENT"
          --intent-file .agent-output/no-mistakes-intent
          --approval-state "${{ inputs.approval }}"
          --prepare
          --json
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.skip_model != 'true'
        with:
          name: no-mistakes-context-${{ inputs.pr-number }}
          path: .agent-output/no-mistakes-intent
          include-hidden-files: true
          if-no-files-found: error
      - name: Record prepare failure
        if: ${{ always() && steps.pending.outputs.head_sha != '' && steps.prepare.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pending.outputs.head_sha }}
        run: |
          set -euo pipefail
          payload_file="$RUNNER_TEMP/no-mistakes-prepare-failed.json"
          jq -n \
            --arg state failure \
            --arg context no-mistakes \
            --arg description "no-mistakes preparation failed" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' \
            > "$payload_file"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --input "$payload_file" >/dev/null

  gate:
    name: run isolated no-mistakes
    needs: prepare
    if: needs.prepare.outputs.skip_model != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.prepare.outputs.concurrency_group }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: target/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: no-mistakes-context-${{ inputs.pr-number }}
          path: target/.agent-output
      - name: Seal exact no-mistakes parent
        run: >-
          node trusted/scripts/agent-crabbox-run.mjs
          --create-exact-parent-bundle
          --input-workdir "$GITHUB_WORKSPACE/target"
          --parent-sha "${{ needs.prepare.outputs.merge_base_sha }}"
          --default-sha "${{ needs.prepare.outputs.default_sha }}"
          --default-branch "${{ needs.prepare.outputs.default_branch }}"
          --json
      - name: Stage trusted remote input
        run: >-
          node trusted/scripts/agent-crabbox-run.mjs
          --stage-input-lane noMistakesRemote
          --input-workdir "$GITHUB_WORKSPACE/target"
          --json
      - name: Seal one syncable no-mistakes workspace
        run: >-
          node trusted/scripts/agent-crabbox-run.mjs
          --prepare-delegated-workspace "$RUNNER_TEMP/agent-no-mistakes-workspace"
          --input-lane noMistakesRemote
          --trusted-workdir "$GITHUB_WORKSPACE/trusted"
          --input-workdir "$GITHUB_WORKSPACE/target"
          --json
      - uses: ./trusted/.github/actions/setup-crabbox
        with:
          repo-root: trusted
          vercel-ready: ${{ vars.CRABBOX_VERCEL_READY }}
      - name: Run isolated no-mistakes in Crabbox
        id: gate
        continue-on-error: true
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          CRABBOX_VERCEL_READY: ${{ vars.CRABBOX_VERCEL_READY }}
          CRABBOX_HETZNER_READY: ${{ vars.CRABBOX_HETZNER_READY }}
          REMOTE_COMMAND: >-
            set -e;
            node trusted/scripts/agent-crabbox-run.mjs
            --restore-input-lane noMistakesRemote
            --input-workdir candidate --json;
            cd candidate;
            export AGENT_TARGET_ROOT="$PWD";
            agent_key="$CODEX_API_KEY"; unset CODEX_API_KEY OPENAI_API_KEY;
            external_head="${{ needs.prepare.outputs.head_sha }}";
            expected_parent_tree="${{ needs.prepare.outputs.merge_base_tree }}";
            expected_default_tree="${{ needs.prepare.outputs.default_tree }}";
            default_branch="${{ needs.prepare.outputs.default_branch }}";
            expected_tree="${{ needs.prepare.outputs.head_tree }}";
            head_ref="${{ needs.prepare.outputs.head_ref }}";
            origin_bundle="$PWD/.agent-output/no-mistakes-parent.bundle";
            result_file=.agent-output/result.json;
            model_started_file=.agent-output/model-started;
            mkdir -p .agent-output;
            preserve_setup_failure() {
              exit_code=$?;
              trap - EXIT;
              if [ "$exit_code" -ne 0 ] ||
                [ ! -s "$result_file" ] ||
                [ ! -s .agent-output/model-usage.json ]; then
                unset agent_key CODEX_API_KEY OPENAI_API_KEY;
                if node ../trusted/scripts/agent-no-mistakes-gate.mjs --write-setup-failure --expected-head "$external_head" --result-file "$result_file" --usage-file .agent-output/model-usage.json --model-started-file "$model_started_file" --model "${{ needs.prepare.outputs.backend_model }}" --effort "${{ needs.prepare.outputs.backend_effort }}" --json >/dev/null 2>&1 &&
                  node ../trusted/scripts/agent-crabbox-run.mjs --emit-output-lane noMistakesRemote; then
                  exit 0;
                fi;
                if [ "$exit_code" -eq 0 ]; then exit_code=1; fi;
              fi;
              exit "$exit_code";
            };
            trap preserve_setup_failure EXIT;
            node ../trusted/scripts/agent-crabbox-run.mjs
            --seed-exact-repository
            --input-workdir "$PWD"
            --expected-tree "$expected_tree"
            --branch "$head_ref"
            --origin-bundle "$origin_bundle"
            --expected-parent-tree "$expected_parent_tree"
            --expected-default-tree "$expected_default_tree"
            --default-branch "$default_branch" --json &&
            npm ci --ignore-scripts --no-audit --no-fund &&
            npm run typecheck &&
            npm run build &&
            npm run test:scenarios &&
            npm install --global --ignore-scripts --no-audit --no-fund @openai/codex@0.144.1 &&
            mkdir -p /tmp/no-mistakes-bin /tmp/no-mistakes-home &&
            curl -fsSL
            https://github.com/kunchenguid/no-mistakes/releases/download/v1.40.0/no-mistakes-v1.40.0-linux-amd64.tar.gz
            -o /tmp/no-mistakes.tar.gz &&
            echo "2445b65179d0e8e9bbf408322f57190f344f9946cfed3971c84fa16ce4122e91  /tmp/no-mistakes.tar.gz"
            | sha256sum --check --strict &&
            tar -xzf /tmp/no-mistakes.tar.gz -C /tmp/no-mistakes-bin &&
            chmod 755 /tmp/no-mistakes-bin/no-mistakes &&
            export PATH="/tmp/no-mistakes-bin:$PATH" &&
            codex_path=$(command -v codex) &&
            model_started_path="$PWD/$model_started_file" &&
            node ../trusted/scripts/agent-no-mistakes-gate.mjs
            --write-codex-wrapper /tmp/no-mistakes-home/codex-turn-marker
            --codex-path "$codex_path"
            --model-started-file "$model_started_path" --json &&
            node ../trusted/scripts/agent-no-mistakes-gate.mjs
            --write-config /tmp/no-mistakes-home/config.yaml
            --agent-path /tmp/no-mistakes-home/codex-turn-marker
            --model "${{ needs.prepare.outputs.backend_model }}"
            --effort "${{ needs.prepare.outputs.backend_effort }}" --json &&
            approval_flag="";
            if [ "${{ inputs.approval }}" = "true" ]; then approval_flag="--user-approved"; fi;
            gate_status=0;
            export CODEX_API_KEY="$agent_key";
            export NM_HOME=/tmp/no-mistakes-home;
            export VET_GATE_DEPS="$PWD";
            export NO_MISTAKES_TELEMETRY=0;
            node ../trusted/scripts/agent-no-mistakes-gate.mjs
            --run-gate
            --expected-head "$external_head"
            --expected-source-tree "$expected_tree"
            --expected-ref "$head_ref"
            --model-started-file "$model_started_file"
            --intent-file .agent-output/no-mistakes-intent
            --fix-patch .agent-output/fix.patch
            --result-file .agent-output/result.json
            --repo-dir "$PWD"
            $approval_flag --json || gate_status=$?;
            unset agent_key CODEX_API_KEY;
            test -s .agent-output/result.json &&
            case "$gate_status" in 0|1) ;; *) exit "$gate_status" ;; esac &&
            node ../trusted/scripts/agent-no-mistakes-gate.mjs
            --export-usage .agent-output/result.json
            --output-file .agent-output/model-usage.json
            --model "${{ needs.prepare.outputs.backend_model }}"
            --effort "${{ needs.prepare.outputs.backend_effort }}"
            --repo-dir "$PWD" --json
        run: >-
          node trusted/scripts/agent-crabbox-run.mjs
          --lane noMistakesRemote
          --command "$REMOTE_COMMAND"
          --workdir "$RUNNER_TEMP/agent-no-mistakes-workspace"
          --delegated-workdir "$RUNNER_TEMP/agent-no-mistakes-workspace/candidate"
          --remote-harness trusted/scripts/agent-crabbox-run.mjs
          --record-file "$RUNNER_TEMP/agent-no-mistakes-workspace/candidate/.agent-output/no-mistakes-remote.json"
          --json
      - name: Classify isolated setup
        id: classify-setup
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/agent-no-mistakes-workspace/candidate/.agent-output/result.json"
          outcome="$(jq -er '.outcome | select(type == "string")' "$result")"
          case "$outcome" in
            setup-failed|model-interrupted) exit 1 ;;
          esac
      - name: Upload sanitized gate result and native fix
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: no-mistakes-result-${{ inputs.pr-number }}
          path: |
            ${{ runner.temp }}/agent-no-mistakes-workspace/candidate/.agent-output/result.json
            ${{ runner.temp }}/agent-no-mistakes-workspace/candidate/.agent-output/fix.patch
            ${{ runner.temp }}/agent-no-mistakes-workspace/candidate/.agent-output/model-usage.json
            ${{ runner.temp }}/agent-no-mistakes-workspace/candidate/.agent-output/no-mistakes-remote.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload redacted remote diagnostics
        if: >-
          always() &&
          (steps.gate.outcome != 'success' ||
          steps.classify-setup.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: no-mistakes-remote-diagnostics-${{ inputs.pr-number }}
          path: |
            ${{ runner.temp }}/agent-no-mistakes-workspace/candidate/.agent-output/crabbox-noMistakesRemote-*.json
            ${{ runner.temp }}/agent-no-mistakes-workspace/candidate/.agent-output/crabbox-noMistakesRemote-*.log
          include-hidden-files: true
          if-no-files-found: warn

  finalize:
    name: finalize no-mistakes
    needs: [prepare, gate]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.skip_model != 'true'
    runs-on: ubuntu-latest
    outputs:
      next-head: ${{ steps.finalize.outputs.next-head }}
      next-repair-attempt: ${{ steps.finalize.outputs.next-repair-attempt }}
      repair-action: ${{ steps.finalize.outputs.repair-action }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download sanitized gate result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: no-mistakes-result-${{ inputs.pr-number }}
          path: ${{ runner.temp }}/no-mistakes-result
      - name: Publish terminal gate state
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: >-
          node scripts/agent-no-mistakes-gate.mjs
          --pr-number "${{ inputs.pr-number }}"
          --finalize
          --expected-head "$HEAD_SHA"
          --fix-patch "$RUNNER_TEMP/no-mistakes-result/fix.patch"
          --result-file "$RUNNER_TEMP/no-mistakes-result/result.json"
          --remote-record "$RUNNER_TEMP/no-mistakes-result/no-mistakes-remote.json"
          --approval-state "${{ inputs.approval }}"
          --infrastructure-retry "${{ inputs.infrastructure-retry }}"
          --repair-attempt "${{ inputs.repair-attempt }}"
          --json
      - name: Record exact no-mistakes cost
        if: always() && steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: >-
          node scripts/agent-cost.mjs
          --pr-number "${{ inputs.pr-number }}"
          --head-sha "$HEAD_SHA"
          --lane no-mistakes
          --usage-file "$RUNNER_TEMP/no-mistakes-result/model-usage.json"
          --remote-record "$RUNNER_TEMP/no-mistakes-result/no-mistakes-remote.json"
          --remote-lane noMistakesRemote
          --retry-reason "semantic revision ${{ inputs.repair-attempt }}"
          --effect decision
          --json

  dispatch-repair:
    name: dispatch reviewer repair
    needs:
      - prepare
      - finalize
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.finalize.outputs.repair-action == 'retry'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch exact-head reviewer repair
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          NEXT_REPAIR_ATTEMPT: ${{ needs.finalize.outputs.next-repair-attempt }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          test "$current_head" = "$HEAD_SHA"
          gh workflow run agent-review.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr-number="$PR_NUMBER" \
            -f expected-head-sha="$HEAD_SHA" \
            -f repair-attempt="$NEXT_REPAIR_ATTEMPT"

  dispatch-native-fix:
    name: validate native no-mistakes fix
    needs:
      - prepare
      - finalize
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.finalize.outputs.repair-action == 'native-fix'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch fresh exact-head CI and independent review
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.finalize.outputs.next-head }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          test "$current_head" = "$HEAD_SHA"
          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr-number="$PR_NUMBER" \
            -f expected-head-sha="$HEAD_SHA"
          gh workflow run agent-review.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr-number="$PR_NUMBER" \
            -f expected-head-sha="$HEAD_SHA" \
            -f repair-attempt="${{ needs.finalize.outputs.next-repair-attempt }}"

  dispatch-automerge:
    name: dispatch automerge
    needs:
      - prepare
      - finalize
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      ((needs.prepare.outputs.skip_model == 'true' &&
      needs.prepare.outputs.replay_passed == 'true') ||
      (needs.prepare.outputs.skip_model != 'true' &&
      needs.finalize.result == 'success' &&
      needs.finalize.outputs.repair-action == 'none'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch automerge for the validated pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run agent-automerge.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          -f pr-number="${{ inputs.pr-number }}"
          -f expected-head-sha="${{ needs.prepare.outputs.head_sha }}"
