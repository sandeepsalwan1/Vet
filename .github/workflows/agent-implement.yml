name: Agent Implement

on:
  workflow_call:
    inputs:
      issue-number:
        required: true
        type: number
    secrets:
      AGENT_GITHUB_TOKEN:
        required: true
      CODEX_ACCESS_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: false
      VERCEL_TOKEN:
        required: false
      VERCEL_OIDC_TOKEN:
        required: false
      HCLOUD_TOKEN:
        required: false
      HETZNER_TOKEN:
        required: false
      HETZNER_API_TOKEN:
        required: false
      RENDER_API_KEY:
        required: false
      RENDER_WORKSPACE_ID:
        required: false
  workflow_dispatch:
    inputs:
      issue-number:
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: agent-implement-${{ inputs.issue-number }}
  cancel-in-progress: false

jobs:
  prepare-prompt:
    name: prepare-prompt
    runs-on: ubuntu-latest
    concurrency:
      group: agent-implement-readiness
      cancel-in-progress: false
    outputs:
      backend-effort: ${{ steps.backend.outputs.effort }}
      backend-model: ${{ steps.backend.outputs.model }}
      backend-sandbox: ${{ steps.backend.outputs.sandbox }}
      concurrency-group: ${{ steps.concurrency.outputs.group }}
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select bounded implementation slot
        id: concurrency
        env:
          CONCURRENCY_KEY: ${{ inputs.issue-number }}
        run: node scripts/agent-concurrency-slot.mjs --lane implement --key "$CONCURRENCY_KEY" --json
      - name: Validate configured implementation backend
        id: backend
        run: node scripts/agent-worker.mjs --validate-backend --lane implement --json
      - name: Require fresh zero-model readiness
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          AGENT_AUTH_PRESENT: ${{ secrets.CODEX_ACCESS_TOKEN != '' || secrets.OPENAI_API_KEY != '' }}
          PUBLISHER_AUTH_PRESENT: ${{ secrets.AGENT_GITHUB_TOKEN != '' }}
          PRIMARY_PROVIDER_AUTH_PRESENT: ${{ (vars.CRABBOX_VERCEL_READY == 'true' && (secrets.VERCEL_TOKEN != '' || secrets.VERCEL_OIDC_TOKEN != '')) || (vars.CRABBOX_HETZNER_READY == 'true' && (secrets.HCLOUD_TOKEN != '' || secrets.HETZNER_TOKEN != '' || secrets.HETZNER_API_TOKEN != '')) }}
          RENDER_AUTH_PRESENT: ${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_WORKSPACE_ID != '' }}
        run: |
          node scripts/agent-readiness.mjs \
            --verify-publisher \
            --json
          node scripts/agent-readiness.mjs \
            --preflight \
            --recover \
            --wait-seconds 900 \
            --json
      - name: Build trusted implementation prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/agent-implement.mjs
          --issue-number "${{ inputs.issue-number }}"
          --write-prompt .agent-output/implement-prompt.md
          --json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-implementation-context-${{ inputs.issue-number }}
          path: |
            .agent-output/implement-prompt.md
            .agent-output/implementation-intent.json
          include-hidden-files: true
          if-no-files-found: error

  generate-patch-remote:
    name: generate-patch-remote
    needs: prepare-prompt
    if: vars.CRABBOX_VERCEL_READY == 'true' || vars.CRABBOX_HETZNER_READY == 'true'
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.generate.outcome == 'success' && steps.implementation-artifact.outcome == 'success' }}
    concurrency:
      group: ${{ needs.prepare-prompt.outputs.concurrency-group }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: agent-implementation-context-${{ inputs.issue-number }}
          path: .agent-output
      - name: Capture exact implementation tree
        id: source-tree
        run: printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Stage trusted remote input
        run: node scripts/agent-crabbox-run.mjs --stage-input-lane implementRemote --json
      - uses: ./.github/actions/setup-crabbox
        with:
          vercel-ready: ${{ vars.CRABBOX_VERCEL_READY }}
      - name: Generate patch in Crabbox
        id: generate
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          CRABBOX_VERCEL_READY: ${{ vars.CRABBOX_VERCEL_READY }}
          CRABBOX_HETZNER_READY: ${{ vars.CRABBOX_HETZNER_READY }}
          REMOTE_COMMAND: >-
            set -e;
            node scripts/agent-crabbox-run.mjs
            --restore-input-lane implementRemote --json &&
            agent_access_token="${CODEX_ACCESS_TOKEN:-}";
            agent_api_key="${CODEX_API_KEY:-}";
            unset CODEX_ACCESS_TOKEN CODEX_API_KEY OPENAI_API_KEY;
            node scripts/agent-crabbox-run.mjs
            --seed-exact-repository
            --expected-tree "${{ steps.source-tree.outputs.tree }}" --json &&
            npm ci --ignore-scripts --no-audit --no-fund &&
            npm install --global --ignore-scripts --no-audit --no-fund @openai/codex@0.144.1 &&
            codex debug prompt-input 'skill discovery probe'
            > /tmp/vet-worker-prompt-input.json &&
            node scripts/agent-skill-discovery.mjs
            --input /tmp/vet-worker-prompt-input.json --json &&
            CODEX_ACCESS_TOKEN="$agent_access_token"
            CODEX_API_KEY="$agent_api_key" node scripts/agent-worker.mjs
            --sandbox danger-full-access
            --prompt-file .agent-output/implement-prompt.md
            --schema .agent/schemas/implementation.schema.json
            --usage-file .agent-output/model-usage.json
            --output-file .agent-output/implementation.md &&
            unset agent_access_token agent_api_key && node scripts/agent-implement.mjs
            --issue-number "${{ inputs.issue-number }}"
            --create-patch .agent-output/codex.patch --json
        run: >-
          node scripts/agent-crabbox-run.mjs
          --lane implementRemote
          --command "$REMOTE_COMMAND"
          --record-file .agent-output/implementation-remote.json
          --json
      - id: implementation-artifact
        uses: actions/upload-artifact@v4
        if: steps.generate.outcome == 'success'
        with:
          name: agent-implementation-${{ inputs.issue-number }}
          path: .agent-output/*
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload redacted remote diagnostics
        if: always() && (steps.generate.outcome != 'success' || steps.implementation-artifact.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: agent-implementation-remote-diagnostics-${{ inputs.issue-number }}
          path: |
            .agent-output/crabbox-implementRemote-*.json
            .agent-output/crabbox-implementRemote-*.log
          include-hidden-files: true
          if-no-files-found: warn

  validate-patch:
    name: validate-patch
    runs-on: ubuntu-latest
    needs: generate-patch-remote
    if: needs.generate-patch-remote.outputs.generated == 'true'
    outputs:
      repair-needed: ${{ steps.validate.outputs.repair-needed }}
      validated: ${{ steps.validate.outputs.validated }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/validate-agent-implementation
        id: validate
        with:
          artifact-name: agent-implementation-${{ inputs.issue-number }}
          issue-number: ${{ inputs.issue-number }}
          allow-repair: "true"

  repair-patch-remote:
    name: repair-patch-remote
    needs:
      - prepare-prompt
      - generate-patch-remote
      - validate-patch
    if: needs.validate-patch.outputs.repair-needed == 'true'
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.generate.outcome == 'success' && steps.repair-artifact.outcome == 'success' }}
    concurrency:
      group: ${{ needs.prepare-prompt.outputs.concurrency-group }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: agent-implementation-repair-context-${{ inputs.issue-number }}
          path: .agent-output
      - name: Build bounded repair prompt
        run: >-
          node scripts/agent-implement.mjs
          --issue-number "${{ inputs.issue-number }}"
          --write-repair-prompt .agent-output/implement-repair-prompt.md
          --validation-feedback .agent-output/validation-feedback.json
          --codex-output .agent-output/implementation.md
          --json
      - name: Preserve initial cost evidence
        run: |
          mv .agent-output/model-usage.json .agent-output/model-usage-initial.json
          mv .agent-output/implementation-remote.json .agent-output/implementation-remote-initial.json
      - name: Capture exact repair tree
        id: source-tree
        run: printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Stage trusted remote repair input
        run: node scripts/agent-crabbox-run.mjs --stage-input-lane implementRepairRemote --json
      - uses: ./.github/actions/setup-crabbox
        with:
          vercel-ready: ${{ vars.CRABBOX_VERCEL_READY }}
      - name: Repair patch in Crabbox
        id: generate
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          CRABBOX_VERCEL_READY: ${{ vars.CRABBOX_VERCEL_READY }}
          CRABBOX_HETZNER_READY: ${{ vars.CRABBOX_HETZNER_READY }}
          REMOTE_COMMAND: >-
            set -e;
            node scripts/agent-crabbox-run.mjs
            --restore-input-lane implementRepairRemote --json &&
            agent_access_token="${CODEX_ACCESS_TOKEN:-}";
            agent_api_key="${CODEX_API_KEY:-}";
            unset CODEX_ACCESS_TOKEN CODEX_API_KEY OPENAI_API_KEY;
            node scripts/agent-crabbox-run.mjs
            --seed-exact-repository
            --expected-tree "${{ steps.source-tree.outputs.tree }}" --json &&
            git apply .agent-output/codex.patch &&
            npm ci --ignore-scripts --no-audit --no-fund &&
            npm install --global --ignore-scripts --no-audit --no-fund @openai/codex@0.144.1 &&
            codex debug prompt-input 'skill discovery probe'
            > /tmp/vet-worker-repair-prompt-input.json &&
            node scripts/agent-skill-discovery.mjs
            --input /tmp/vet-worker-repair-prompt-input.json --json &&
            CODEX_ACCESS_TOKEN="$agent_access_token"
            CODEX_API_KEY="$agent_api_key" node scripts/agent-worker.mjs
            --lane implement
            --model "${{ needs.prepare-prompt.outputs.backend-model }}"
            --effort "${{ needs.prepare-prompt.outputs.backend-effort }}"
            --sandbox danger-full-access
            --prompt-file .agent-output/implement-repair-prompt.md
            --schema .agent/schemas/implementation.schema.json
            --usage-file .agent-output/model-usage.json
            --output-file .agent-output/implementation.md &&
            unset agent_access_token agent_api_key && node scripts/agent-implement.mjs
            --issue-number "${{ inputs.issue-number }}"
            --create-patch .agent-output/codex.patch --json
        run: >-
          node scripts/agent-crabbox-run.mjs
          --lane implementRepairRemote
          --command "$REMOTE_COMMAND"
          --record-file .agent-output/implementation-remote.json
          --json
      - id: repair-artifact
        uses: actions/upload-artifact@v4
        if: steps.generate.outcome == 'success'
        with:
          name: agent-implementation-repaired-${{ inputs.issue-number }}
          path: .agent-output/*
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload redacted repair diagnostics
        if: always() && (steps.generate.outcome != 'success' || steps.repair-artifact.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: agent-implementation-repair-remote-diagnostics-${{ inputs.issue-number }}
          path: |
            .agent-output/crabbox-implementRepairRemote-*.json
            .agent-output/crabbox-implementRepairRemote-*.log
          include-hidden-files: true
          if-no-files-found: warn

  validate-repair:
    name: validate-repair
    runs-on: ubuntu-latest
    needs: repair-patch-remote
    if: needs.repair-patch-remote.outputs.generated == 'true'
    outputs:
      validated: ${{ steps.validate.outputs.validated }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/validate-agent-implementation
        id: validate
        with:
          artifact-name: agent-implementation-repaired-${{ inputs.issue-number }}
          issue-number: ${{ inputs.issue-number }}
          allow-repair: "false"

  open-pr:
    name: open-pr
    runs-on: ubuntu-latest
    needs:
      - validate-patch
      - validate-repair
    if: >-
      always() &&
      (needs.validate-patch.outputs.validated == 'true' ||
      needs.validate-repair.outputs.validated == 'true')
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: agent-implementation-validated-${{ inputs.issue-number }}
          path: .agent-output
      - name: Apply patch and open PR
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: >-
          node scripts/agent-implement.mjs
          --issue-number "${{ inputs.issue-number }}"
          --apply-patch .agent-output/codex.patch
          --codex-output .agent-output/implementation.md
          --integrity-manifest .agent-output/integrity.json
          --json
      - name: Record failed initial implementation cost
        if: hashFiles('.agent-output/model-usage-initial.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/agent-cost.mjs
          --pr-number "${{ steps.apply.outputs.pr_number }}"
          --head-sha "${{ steps.apply.outputs.head_sha }}"
          --lane implement
          --usage-file .agent-output/model-usage-initial.json
          --remote-record .agent-output/implementation-remote-initial.json
          --remote-lane implementRemote
          --retry-reason "initial validation failure"
          --effect none
          --omit-actions-usage
          --json
      - name: Record exact implementation cost
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE_LANE: ${{ needs.validate-repair.outputs.validated == 'true' && 'implementRepairRemote' || 'implementRemote' }}
          RETRY_REASON: ${{ needs.validate-repair.outputs.validated == 'true' && 'focused validation repair' || 'initial' }}
        run: >-
          node scripts/agent-cost.mjs
          --pr-number "${{ steps.apply.outputs.pr_number }}"
          --head-sha "${{ steps.apply.outputs.head_sha }}"
          --lane implement
          --usage-file .agent-output/model-usage.json
          --remote-record .agent-output/implementation-remote.json
          --remote-lane "$REMOTE_LANE"
          --retry-reason "$RETRY_REASON"
          --effect new-head
          --json

  report-failure:
    name: report-failure
    runs-on: ubuntu-latest
    needs:
      - generate-patch-remote
      - validate-patch
      - repair-patch-remote
      - validate-repair
      - open-pr
    if: always() && needs.open-pr.result != 'success'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Record implementation blocker
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/agent-implement.mjs --issue-number "${{ inputs.issue-number }}" --mark-failed --json
