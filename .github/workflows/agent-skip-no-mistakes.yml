name: Agent Skip no-mistakes

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Agent pull request number
        required: true
        type: number
      expected-head-sha:
        description: Exact current pull request head SHA
        required: true
        type: string

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: agent-skip-no-mistakes-${{ inputs.pr-number }}
  cancel-in-progress: false

jobs:
  bypass:
    name: record owner bypass
    runs-on: ubuntu-latest
    steps:
      - name: Validate owner and exact pull request head
        id: target
        env:
          APPROVAL_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REQUESTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
        run: |
          set -euo pipefail
          test "${APPROVAL_ACTOR,,}" = "${REPOSITORY_OWNER,,}"
          [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          pull_file="$RUNNER_TEMP/no-mistakes-bypass-pull.json"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRepository,headRefOid,isCrossRepository,labels,state > "$pull_file"
          head_repo="$(jq -r '.headRepository.nameWithOwner // ""' "$pull_file")"
          head_sha="$(jq -r '.headRefOid // ""' "$pull_file")"
          test "$(jq -r .state "$pull_file")" = OPEN
          test "$(jq -r .isCrossRepository "$pull_file")" = false
          test "$head_repo" = "$GITHUB_REPOSITORY"
          test "$head_sha" = "$REQUESTED_HEAD_SHA"
          test "$(jq '[.labels[].name == "agent:blocked"] | any' "$pull_file")" = false
          test "$(jq '[.labels[].name == "agent:automerge"] | any' "$pull_file")" = true
          printf 'head-sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Require successful exact-head CI and independent review
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.target.outputs.head-sha }}
        run: |
          set -euo pipefail
          statuses_file="$RUNNER_TEMP/no-mistakes-bypass-statuses.json"
          checks_file="$RUNNER_TEMP/no-mistakes-bypass-checks.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" > "$statuses_file"
          review_state="$(
            jq -r --arg prefix "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/" \
              '[.[] | select(
                .context == "agent-review" and
                .creator.login == "github-actions[bot]" and
                (.target_url | startswith($prefix))
              )] | sort_by(.created_at) | last | .state // "missing"' \
              "$statuses_file"
          )"
          test "$review_state" = success
          gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" > "$checks_file"
          required_checks=(quality build scenarios audit dependency-review)
          for check in "${required_checks[@]}"; do
            state="$(
              jq -r \
                --arg check "$check" \
                --arg sha "$HEAD_SHA" \
                --arg prefix "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/" \
                '[.check_runs[] | select(
                  .name == $check and
                  .head_sha == $sha and
                  .app.slug == "github-actions" and
                  (.details_url | startswith($prefix))
                )] | sort_by(.started_at) | last | (.conclusion // .status // "missing")' \
                "$checks_file"
            )"
            test "$state" = success
          done

      - name: Record exact-head bypass and continue automerge
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.target.outputs.head-sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          payload_file="$RUNNER_TEMP/no-mistakes-bypass-status.json"
          jq -n \
            --arg state success \
            --arg context no-mistakes-bypass \
            --arg description "no-mistakes skipped by repository owner for this exact head" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' \
            > "$payload_file"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --input "$payload_file" >/dev/null
          gh workflow run agent-automerge.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr-number="$PR_NUMBER" \
            -f expected-head-sha="$HEAD_SHA"
