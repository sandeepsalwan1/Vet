name: Agent Review

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: number
      expected-head-sha:
        required: false
        type: string
        default: ""
      repair-attempt:
        required: false
        type: number
        default: 0
    secrets:
      OPENAI_API_KEY:
        required: true
      VERCEL_TOKEN:
        required: false
      VERCEL_OIDC_TOKEN:
        required: false
      HCLOUD_TOKEN:
        required: false
      HETZNER_TOKEN:
        required: false
      HETZNER_API_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: number
      expected-head-sha:
        description: Exact current pull request head SHA
        required: false
        type: string
        default: ""
      repair-attempt:
        description: Shared semantic revision count
        required: false
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: agent-semantic-${{ inputs.pr-number }}
  cancel-in-progress: false

jobs:
  prepare-review:
    name: prepare-review
    runs-on: ubuntu-latest
    outputs:
      backend-effort: ${{ steps.backend.outputs.effort }}
      backend-model: ${{ steps.backend.outputs.model }}
      concurrency-group: ${{ steps.concurrency.outputs.group }}
      reviewed-base-sha: ${{ steps.mark-pending.outputs.base-sha }}
      reviewed-head-sha: ${{ steps.mark-pending.outputs.head-sha }}
      replay-next-gate: ${{ steps.prompt.outputs.replay-next-gate }}
      skip-model: ${{ steps.prompt.outputs.skip-model }}
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      - name: Capture review head
        id: mark-pending
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REQUESTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
        run: |
          set -euo pipefail
          pull="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefOid,headRefOid)"
          sha="$(jq -r .headRefOid <<<"$pull")"
          base_sha="$(jq -r .baseRefOid <<<"$pull")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$REQUESTED_HEAD_SHA" ]; then
            [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$sha" = "$REQUESTED_HEAD_SHA"
          fi
          printf 'base-sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          printf 'head-sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select review model
        id: backend
        env:
          BACKEND_LANE: ${{ inputs.repair-attempt > 0 && 'no-mistakes' || 'review' }}
        run: node scripts/agent-worker.mjs --validate-backend --lane "$BACKEND_LANE" --json
      - name: Allocate review capacity
        id: concurrency
        env:
          CONCURRENCY_KEY: ${{ inputs.pr-number }}
        run: node scripts/agent-concurrency-slot.mjs --lane review --key "$CONCURRENCY_KEY" --json
      - name: Validate review target and build prompt
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD_SHA: ${{ steps.mark-pending.outputs.head-sha }}
        run: >-
          node scripts/agent-review.mjs
          --pr-number "${{ inputs.pr-number }}"
          --expected-head-sha "$REVIEWED_HEAD_SHA"
          --wait-for-ci
          --json
      - name: Build exact-head review prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD_SHA: ${{ steps.mark-pending.outputs.head-sha }}
        run: >-
          node scripts/agent-review.mjs
          --pr-number "${{ inputs.pr-number }}"
          --expected-head-sha "$REVIEWED_HEAD_SHA"
          --write-prompt .agent-output/review-prompt.md
          --json
      - name: Mark review pending
        if: steps.prompt.outputs.skip-model != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD_SHA: ${{ steps.mark-pending.outputs.head-sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$REVIEWED_HEAD_SHA" \
            --method POST \
            -f state=pending \
            -f context=agent-review \
            -f description='agent review running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Dispatch trusted pull request CodeQL
        if: steps.prompt.outputs.skip-model != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD_SHA: ${{ steps.mark-pending.outputs.head-sha }}
        run: >-
          node scripts/agent-review.mjs
          --pr-number "${{ inputs.pr-number }}"
          --expected-head-sha "$REVIEWED_HEAD_SHA"
          --dispatch-pr-security
          --json
      - run: cp .agent/schemas/review.schema.json .agent-output/review.schema.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-review-context-${{ inputs.pr-number }}
          path: |
            .agent-output/review-prompt.md
            .agent-output/review.schema.json
          include-hidden-files: true
          if-no-files-found: error

  generate-review:
    name: generate-review
    needs: prepare-review
    if: needs.prepare-review.outputs.skip-model != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.prepare-review.outputs.concurrency-group }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-review.outputs.reviewed-head-sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: target/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: agent-review-context-${{ inputs.pr-number }}
          path: target/.agent-output
      - name: Capture exact review tree
        id: candidate-tree
        working-directory: target
        run: printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Stage trusted remote input
        run: >-
          node trusted/scripts/agent-crabbox-run.mjs
          --stage-input-lane reviewRemote
          --input-workdir "$GITHUB_WORKSPACE/target"
          --json
      - name: Seal one syncable review workspace
        run: >-
          node trusted/scripts/agent-crabbox-run.mjs
          --prepare-delegated-workspace "$RUNNER_TEMP/agent-review-workspace"
          --input-lane reviewRemote
          --trusted-workdir "$GITHUB_WORKSPACE/trusted"
          --input-workdir "$GITHUB_WORKSPACE/target"
          --json
      - uses: ./trusted/.github/actions/setup-crabbox
        with:
          repo-root: trusted
          vercel-ready: ${{ vars.CRABBOX_VERCEL_READY }}
      - name: Review exact head in Crabbox
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          CRABBOX_VERCEL_READY: ${{ vars.CRABBOX_VERCEL_READY }}
          CRABBOX_HETZNER_READY: ${{ vars.CRABBOX_HETZNER_READY }}
          REMOTE_COMMAND: >-
            set -e;
            node trusted/scripts/agent-crabbox-run.mjs
            --restore-input-lane reviewRemote
            --input-workdir candidate --json &&
            cd candidate &&
            export AGENT_TARGET_ROOT="$PWD";
            agent_key="$CODEX_API_KEY"; unset CODEX_API_KEY OPENAI_API_KEY;
            node ../trusted/scripts/agent-crabbox-run.mjs
            --seed-exact-repository
            --input-workdir "$PWD"
            --expected-tree "${{ steps.candidate-tree.outputs.tree }}" --json &&
            npm ci --ignore-scripts --no-audit --no-fund &&
            npm install --global --ignore-scripts --no-audit --no-fund @openai/codex@0.144.1 &&
            codex debug prompt-input 'skill discovery probe'
            > /tmp/vet-review-prompt-input.json &&
            node ../trusted/scripts/agent-skill-discovery.mjs
            --input /tmp/vet-review-prompt-input.json --json &&
            CODEX_API_KEY="$agent_key" node ../trusted/scripts/agent-worker.mjs
            --lane review
            --model "${{ needs.prepare-review.outputs.backend-model }}"
            --effort "${{ needs.prepare-review.outputs.backend-effort }}"
            --sandbox danger-full-access
            --prompt-file .agent-output/review-prompt.md
            --schema .agent-output/review.schema.json
            --usage-file .agent-output/model-usage.json
            --output-file .agent-output/review.json &&
            unset agent_key && node ../trusted/scripts/agent-review.mjs
            --pr-number "${{ inputs.pr-number }}"
            --create-patch .agent-output/review.patch --json
        run: >-
          node trusted/scripts/agent-crabbox-run.mjs
          --lane reviewRemote
          --command "$REMOTE_COMMAND"
          --workdir "$RUNNER_TEMP/agent-review-workspace"
          --delegated-workdir "$RUNNER_TEMP/agent-review-workspace/candidate"
          --remote-harness trusted/scripts/agent-crabbox-run.mjs
          --record-file "$RUNNER_TEMP/agent-review-workspace/candidate/.agent-output/review-remote.json"
          --json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-review-result-${{ inputs.pr-number }}
          path: |
            ${{ runner.temp }}/agent-review-workspace/candidate/.agent-output/review.json
            ${{ runner.temp }}/agent-review-workspace/candidate/.agent-output/review.patch
            ${{ runner.temp }}/agent-review-workspace/candidate/.agent-output/model-usage.json
            ${{ runner.temp }}/agent-review-workspace/candidate/.agent-output/review-remote.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload redacted remote diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-review-remote-diagnostics-${{ inputs.pr-number }}
          path: |
            ${{ runner.temp }}/agent-review-workspace/candidate/.agent-output/crabbox-reviewRemote-*.json
            ${{ runner.temp }}/agent-review-workspace/candidate/.agent-output/crabbox-reviewRemote-*.log
          include-hidden-files: true
          if-no-files-found: warn

  apply-review:
    name: apply-review
    runs-on: ubuntu-latest
    needs:
      - prepare-review
      - generate-review
    if: needs.prepare-review.outputs.skip-model != 'true'
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    outputs:
      next-gate: ${{ steps.apply.outputs.next-gate }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: agent-review-result-${{ inputs.pr-number }}
          path: .agent-output
      - name: Apply review result
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD_SHA: ${{ needs.prepare-review.outputs.reviewed-head-sha }}
        run: >-
          node scripts/agent-review.mjs
          --pr-number "${{ inputs.pr-number }}"
          --expected-head-sha "$REVIEWED_HEAD_SHA"
          --from-file .agent-output/review.json
          --apply-patch .agent-output/review.patch
          --remote-record .agent-output/review-remote.json
          --repair-attempt "${{ inputs.repair-attempt }}"
          --json
      - name: Record exact review cost
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD_SHA: ${{ needs.prepare-review.outputs.reviewed-head-sha }}
        run: >-
          node scripts/agent-cost.mjs
          --pr-number "${{ inputs.pr-number }}"
          --head-sha "$REVIEWED_HEAD_SHA"
          --lane review
          --usage-file .agent-output/model-usage.json
          --remote-record .agent-output/review-remote.json
          --remote-lane reviewRemote
          --retry-reason "semantic revision ${{ inputs.repair-attempt }}"
          --effect decision
          --json

  dispatch-no-mistakes:
    name: dispatch final gate
    needs:
      - prepare-review
      - apply-review
    if: >-
      always() &&
      needs.prepare-review.result == 'success' &&
      ((needs.prepare-review.outputs.skip-model == 'true' &&
      needs.prepare-review.outputs.replay-next-gate != '') ||
      (needs.prepare-review.outputs.skip-model != 'true' &&
      needs.apply-review.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Dispatch standalone no-mistakes gate
        env:
          GH_TOKEN: ${{ github.token }}
          APPLIED_NEXT_GATE: ${{ needs.apply-review.outputs.next-gate }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPLAY_NEXT_GATE: ${{ needs.prepare-review.outputs.replay-next-gate }}
          SKIP_MODEL: ${{ needs.prepare-review.outputs.skip-model }}
        run: |
          set -euo pipefail
          if [ "$SKIP_MODEL" = true ]; then
            NEXT_GATE="$REPLAY_NEXT_GATE"
          else
            NEXT_GATE="$APPLIED_NEXT_GATE"
          fi
          head_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          review_state="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/statuses?per_page=100" \
              --jq '[.[] | select(.context == "agent-review" and .creator.login == "github-actions[bot]")] | sort_by(.created_at) | last | .state // "missing"'
          )"
          if [ "$review_state" != success ]; then
            echo "Agent review is $review_state; no-mistakes waits for the repair cycle."
            exit 0
          fi
          required_checks=(quality build scenarios audit dependency-review)
          checks_file="$RUNNER_TEMP/review-checks.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?per_page=100" > "$checks_file"
          for check in "${required_checks[@]}"; do
            state="$(
              jq -r --arg check "$check" --arg sha "$head_sha" \
                '[.check_runs[] | select(.name == $check and .head_sha == $sha and .app.slug == "github-actions")] | sort_by(.started_at) | last | (.conclusion // .status // "missing")' \
                "$checks_file"
            )"
            if [ "$state" != success ]; then
              echo "Required check $check is $state; no-mistakes will not run."
              exit 0
            fi
          done
          case "$NEXT_GATE" in
            automerge)
              gh workflow run agent-automerge.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f pr-number="$PR_NUMBER" \
                -f expected-head-sha="$head_sha"
              ;;
            no-mistakes)
              gh workflow run agent-no-mistakes.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f pr-number="$PR_NUMBER" \
                -f expected-head-sha="$head_sha" \
                -f repair-attempt="${{ inputs.repair-attempt }}" \
                -f intent='Validate the agent-created PR after automated review. The PR must satisfy its linked issue, preserve repo architecture, pass CI, and remain blocked rather than auto-merged if no-mistakes finds ask-user or high-risk issues.'
              ;;
            *)
              echo "Unknown final gate: $NEXT_GATE" >&2
              exit 1
              ;;
          esac

  report-review-failure:
    name: report-review-failure
    runs-on: ubuntu-latest
    needs:
      - prepare-review
      - generate-review
      - apply-review
    if: >-
      always() &&
      needs.prepare-review.outputs.reviewed-head-sha != '' &&
      needs.prepare-review.outputs.skip-model != 'true' &&
      (needs.prepare-review.result != 'success' ||
      needs.generate-review.result != 'success' ||
      needs.apply-review.result != 'success')
    permissions:
      statuses: write
    steps:
      - name: Mark agent review failed
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD_SHA: ${{ needs.prepare-review.outputs.reviewed-head-sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/statuses/$REVIEWED_HEAD_SHA" \
            --method POST \
            -f state=failure \
            -f context=agent-review \
            -f description='agent review workflow failed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
