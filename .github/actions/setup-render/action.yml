name: Set up pinned Render CLI
description: Install the trusted Render CLI binary with a fixed checksum.

runs:
  using: composite
  steps:
    - name: Install Render CLI 2.22.0
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/cli_2.22.0_linux_amd64.zip"
        bin="$RUNNER_TEMP/render-cli"
        curl -fsSL \
          https://github.com/render-oss/cli/releases/download/v2.22.0/cli_2.22.0_linux_amd64.zip \
          -o "$archive"
        echo "6cdcd11897b7bd7e673317e6f4aaf041b654d818444f3b1efec7240a835f79ec  $archive" | sha256sum --check
        mkdir -p "$bin"
        unzip -q "$archive" cli_v2.22.0 -d "$bin"
        mv "$bin/cli_v2.22.0" "$bin/render"
        chmod 755 "$bin/render"
        echo "$bin" >> "$GITHUB_PATH"
